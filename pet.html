<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Rock Pet</title>
<link rel="stylesheet" href="mascot.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  #stage { position: absolute; left: 35px; bottom: 0; width: 50px; }
  #bubble {
    position: absolute; left: -35px; right: -35px; bottom: 50px;
    background: #eef1f3; color: #222; font: 11px/1.25 "Segoe UI", system-ui, sans-serif;
    padding: 5px 8px; border-radius: 9px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  #bubble.show { opacity: 1; }
  #flip { cursor: grab; }
  #flip.dragging { cursor: grabbing; }
  #flip.walk #mascot-slot { animation: waddle .4s ease-in-out infinite; transform-origin: 50% 90%; }
  #flip.hop #mascot-slot { animation: petHop .6s ease-out 1; }
  #flip.squash #mascot-slot { animation: squash .25s ease-out 1; transform-origin: 50% 100%; }
  #mascot { width: 100%; display: block; overflow: visible; }
  @keyframes waddle { 0%,100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-2px); } }
  @keyframes petHop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-11px); } }
  @keyframes squash { 0% { transform: scale(1.2,.75); } 100% { transform: scale(1,1); } }
</style>
</head>
<body>
<div id="stage">
  <div id="bubble"></div>
  <div id="flip"><div id="mascot-slot"></div></div>
</div>
<script src="mascot.js"></script>
<script src="pet.js"></script>
</body>
</html>
