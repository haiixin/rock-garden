<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Rock Garden</title>
<link rel="stylesheet" href="mascot.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="tb-btns left">
      <button id="btn-pet" title="Let the rock out on your desktop" aria-label="Desktop pet"><span data-icon="paw-print"></span></button>
      <button id="btn-shop" title="Shop" aria-label="Shop"><span data-icon="storefront"></span></button>
    </div>
    <span class="brand">Rock Garden</span>
    <div class="tb-btns">
      <button id="btn-pin" title="Always on top" aria-label="Always on top" class="on"><span data-icon="push-pin"></span></button>
      <button id="btn-min" title="Minimize" aria-label="Minimize"><span data-icon="minus"></span></button>
      <button id="btn-compact" title="Compact mode" aria-label="Compact mode"><span data-icon="arrows-in-line-vertical"></span></button>
      <button id="btn-close" title="Quit" aria-label="Quit"><span data-icon="x"></span></button>
    </div>
  </header>

  <!-- ===== main screen ===== -->
  <div id="screen-main" class="screen">
    <section id="top">
      <div id="mascot-wrap">
        <div id="bubble">Hi! Ready to focus?</div>
        <div id="mascot-slot"></div>
      </div>

      <div id="timer-wrap">
        <div id="modes">
          <button data-mode="focus" class="active">Focus</button>
          <button data-mode="short">Short</button>
          <button data-mode="long">Long</button>
        </div>
        <div id="time">25:00</div>
        <div id="controls">
          <button id="btn-start" class="primary">Start</button>
          <button id="btn-reset" title="Reset" aria-label="Reset"><span data-icon="arrow-counter-clockwise"></span></button>
          <button id="btn-skip" title="Skip" aria-label="Skip"><span data-icon="skip-forward"></span></button>
        </div>
      </div>
    </section>

    <section id="points">
      <div class="pt-row">
        <span id="level">Lv 1</span>
        <span id="pts"></span>
        <span id="today"></span>
      </div>
      <div id="bar"><div id="bar-fill"></div></div>
    </section>

    <section id="todos">
      <form id="todo-form">
        <input id="todo-input" type="text" placeholder="Add a task (+5 coins when done)" aria-label="New task" maxlength="80" autocomplete="off">
      </form>
      <ul id="todo-list"></ul>
      <div id="todo-foot"><button id="clear-done">Clear done</button></div>
    </section>
  </div>

  <!-- ===== shop screen ===== -->
  <div id="screen-shop" class="screen" hidden>
    <div id="shop-head">
      <button id="shop-back"><span data-icon="arrow-left" data-size="14"></span>Back</button>
      <span id="shop-title">Shop</span>
      <span id="shop-bal"></span>
    </div>
    <div id="shop-preview"></div>
    <div id="shop-tabs">
      <button data-cat="hat" class="active">Accessories</button>
      <button data-cat="color">Color</button>
      <button data-cat="theme">Theme</button>
      <button data-cat="prize">My prizes</button>
    </div>
    <form id="prize-form" hidden>
      <input id="prize-name" type="text" placeholder="Prize, e.g. New headphones" aria-label="Prize name" maxlength="40" autocomplete="off">
      <input id="prize-price" type="number" min="1" max="99999" placeholder="Coins" aria-label="Price in coins" autocomplete="off">
      <button class="primary" type="submit">Add</button>
    </form>
    <div id="shop-grid"></div>
  </div>

  <!-- ===== purchase confirmation ===== -->
  <div id="receipt" hidden>
    <div id="rc-head"></div>
    <div id="rc-ico"></div>
    <div id="rc-name"></div>
    <div id="rc-sub"></div>
    <div id="rc-hint">Click anywhere to exit</div>
  </div>
</div>
<script src="mascot.js"></script>
<script src="icons.js"></script>
<script src="renderer.js"></script>
</body>
</html>
